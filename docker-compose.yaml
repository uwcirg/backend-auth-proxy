services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - fhir_backend_auth.env.default
    environment:
      REDIS_URL: redis://redis:6379/0
      JWK_KEY_DIR: /data/jwks
    volumes:
      - jwk_keys:/data/jwks
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  jwk_keys:
