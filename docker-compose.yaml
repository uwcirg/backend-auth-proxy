services:
  fhirbackendauth:
    build: .
    ports:
      - "8000:8000"
    expose:
      - "8000"
    env_file:
      - fhirbackendauth.env.default
    environment:
      REDIS_URL: redis://redis:6379/2
      JWK_KEY_DIR: /data/jwks
      PYTHONUNBUFFERED: "1"
    volumes:
      - jwk-keys:/data/jwks
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7

volumes:
  jwk-keys:
