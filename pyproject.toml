[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir_backend_auth"
version = "0.1.0"
description = "Epic FHIR Backend Auth Proxy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "fakeredis>=2.26.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fhir_backend_auth*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--color=yes -v"
